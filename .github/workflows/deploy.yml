name: CI and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'fakturomat-production' || format('fakturomat-ci-{0}', github.run_id) }}
  queue: max

env:
  CI: "true"
  WRANGLER_SEND_METRICS: "false"
  DENO_NO_UPDATE_CHECK: "1"

jobs:
  dependabot-compatibility:
    name: Dependabot compatibility
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        id: metadata
        with:
          compat-lookup: true
      - name: Check compatibility of every updated dependency
        env:
          UPDATES: ${{ steps.metadata.outputs.updated-dependencies-json }}
        run: |
          jq -r '.[] | "\(.dependencyName): \(.compatScore)% (0 may mean unknown)"' <<< "$UPDATES"
          jq -e 'type == "array" and length > 0 and
            all(.[]; (.prevVersion | length) > 0 and (.newVersion | length) > 0 and .compatScore == 100)' <<< "$UPDATES"

  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.7
      - name: Install locked dependencies
        run: deno install --frozen-lockfile --allow-scripts=npm:esbuild,npm:workerd
      - name: Format, lint and types
        run: deno task check
      - name: Tests
        run: deno task test
      - name: Build and test in Workers runtime
        run: deno task test:startup
      - name: Save tested build for deployment
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: worker-build
          overwrite: true
          if-no-files-found: error
          include-hidden-files: true
          path: |
            _fresh/client/
            _fresh/server/*.mjs
            _fresh/server/*.mjs.map
            _fresh/server/assets/
            _fresh/server/wrangler.json

  deploy:
    needs: checks
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://fakturomat.caretsix.com
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.7
      - name: Install locked dependencies
        run: deno install --frozen-lockfile --allow-scripts=npm:esbuild,npm:workerd
      - uses: actions/download-artifact@v8
        with:
          name: worker-build
          path: _fresh
      - name: Apply D1 migrations and deploy tested build
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_API_TOKEN:?Set the production CLOUDFLARE_API_TOKEN secret}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Set the production CLOUDFLARE_ACCOUNT_ID secret}"
          deno run -A npm:wrangler@4.151.1 d1 migrations apply DB --remote --config wrangler.jsonc
          deno run -A npm:wrangler@4.151.1 deploy --config _fresh/server/wrangler.json
      - name: Verify public production healthcheck
        run: |
          set -euo pipefail
          response_dir=$(mktemp -d)
          trap 'rm -rf "$response_dir"' EXIT
          for attempt in {1..6}; do
            status=$(curl --silent --show-error --connect-timeout 5 --max-time 10 \
              --dump-header "$response_dir/headers" --output "$response_dir/body" \
              --write-out '%{http_code}' https://fakturomat.caretsix.com/health) || status=000
            if [[ "$status" == 200 ]] \
              && jq -e '. == {"status":"ok"}' "$response_dir/body" >/dev/null 2>&1 \
              && grep -Eiq '^content-type: application/json([;[:space:]]|$)' "$response_dir/headers" \
              && grep -Eiq '^cache-control:.*no-store' "$response_dir/headers" \
              && ! grep -Eiq '^(location|set-cookie):' "$response_dir/headers"; then
              echo 'Production healthcheck passed.'
              exit 0
            fi
            echo "Healthcheck attempt $attempt failed (HTTP $status)."
            if [[ "$attempt" != 6 ]]; then sleep 5; fi
          done
          echo '::error::Deployment completed, but public /health verification failed. Check Worker logs, domain routing, Access/WAF and cache rules.'
          exit 1
