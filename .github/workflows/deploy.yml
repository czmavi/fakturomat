name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fakturomat-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://fakturomat.caretsix.com
    env:
      CI: "true"
      WRANGLER_SEND_METRICS: "false"
      DENO_NO_UPDATE_CHECK: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.7
      - name: Install locked dependencies
        run: deno install --frozen-lockfile --allow-scripts=npm:esbuild,npm:workerd
      - name: Format, lint and types
        run: deno task check
      - name: Tests
        run: deno task test
      - name: Build and test in Workers runtime
        run: deno task test:startup
      - name: Apply D1 migrations and deploy tested build
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_API_TOKEN:?Set the production CLOUDFLARE_API_TOKEN secret}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Set the production CLOUDFLARE_ACCOUNT_ID secret}"
          deno run -A npm:wrangler@4.151.1 d1 migrations apply DB --remote --config wrangler.jsonc
          deno run -A npm:wrangler@4.151.1 deploy --config _fresh/server/wrangler.json
      - name: Verify public production healthcheck
        run: |
          set -euo pipefail
          response_dir=$(mktemp -d)
          trap 'rm -rf "$response_dir"' EXIT
          for attempt in {1..6}; do
            status=$(curl --silent --show-error --connect-timeout 5 --max-time 10 \
              --dump-header "$response_dir/headers" --output "$response_dir/body" \
              --write-out '%{http_code}' https://fakturomat.caretsix.com/health) || status=000
            if [[ "$status" == 200 ]] \
              && jq -e '. == {"status":"ok"}' "$response_dir/body" >/dev/null 2>&1 \
              && grep -Eiq '^content-type: application/json([;[:space:]]|$)' "$response_dir/headers" \
              && grep -Eiq '^cache-control:.*no-store' "$response_dir/headers" \
              && ! grep -Eiq '^(location|set-cookie):' "$response_dir/headers"; then
              echo 'Production healthcheck passed.'
              exit 0
            fi
            echo "Healthcheck attempt $attempt failed (HTTP $status)."
            if [[ "$attempt" != 6 ]]; then sleep 5; fi
          done
          echo '::error::Deployment completed, but public /health verification failed. Check Worker logs, domain routing, Access/WAF and cache rules.'
          exit 1
